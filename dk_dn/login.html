<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng Nhập - Chill Coffee</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">

    <form class="form" method="post" action="login.php">
        <h2>Đăng Nhập</h2>

        <div class="input-group">
            <label>Số điện thoại / Email / Tên đăng nhập</label>
            <input type="text" name="username" placeholder="Nhập thông tin của bạn" required>
        </div>

        <div class="input-group password-group">
            <label>Mật khẩu</label>
            <input type="password" id="password-dn" name="user_password" placeholder="Nhập mật khẩu" required>
            <span class="toggle" onclick="togglePassword('password-dn')">👁</span>
        </div>

        <a href="#" class="forgot">Quên mật khẩu?</a>

        <button type="submit" class="btn">Đăng Nhập</button>

        <div class="social">
            <span>Hoặc đăng nhập với</span>
            <div class="social-btns">
                <button type="button" class="fb">Facebook</button>
                <button type="button" class="gg">Google</button>
            </div>
        </div>

        <p class="switch">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
    </form>

</div>

<script src="auth.js"></script>
</body>
</html>
