<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng Ký - Chill Coffee</title>
<link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-container">

    <form class="form" method="post" action="register.php">
        <h2>Đăng Ký</h2>

        <div class="input-group">
            <label>Họ và Tên</label>
            <input type="text" name="username" placeholder="Nhập tên của bạn" required>
        </div>

        <div class="input-group">
            <label>Số điện thoại</label>
            <input type="text" name="user_hotline" placeholder="Nhập số điện thoại">
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Nhập email" required>
        </div>

        <div class="input-group password-group">
            <label>Mật khẩu</label>
            <input type="password" id="password-dk" name="user_password" placeholder="Tạo mật khẩu" required>
            <span class="toggle" onclick="togglePassword('password-dk')">👁</span>
        </div>

        <a href="#" class="forgot">Quên mật khẩu?</a>

        <button type="submit" name="bt_dangky" class="btn">Tạo Tài Khoản</button>

        <div class="social">
            <span>Hoặc đăng ký với</span>
            <div class="social-btns">
                <button type="button" class="fb">Facebook</button>
                <button type="button" class="gg">Google</button>
            </div>
        </div>

        <p class="switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    </form>

</div>

<script src="../css/auth.js"></script>
</body>
</html>
